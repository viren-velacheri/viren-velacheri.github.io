<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Finding patterns in baseball pitches</title>
  <desc id="desc">Three pitch trajectories diverge from one point across a plotting field, with measured data points following their curves.</desc>
  <rect width="640" height="400" fill="#f0eee6"/>
  <g stroke="#242621" stroke-width="1">
    <path d="M48 48H72M48 48V72M592 48H568M592 48V72M48 352H72M48 352V328M592 352H568M592 352V328" opacity=".25"/>
    <path d="M105 76V306H554" opacity=".5"/>
    <path d="M105 126H553M105 186H553M105 246H553M195 76V306M285 76V306M375 76V306M465 76V306M553 76V306" opacity=".1" stroke-dasharray="2 5"/>
    <path d="M105 277C207 156 324 111 520 105"/>
    <path d="M105 277C239 232 360 220 520 257" opacity=".45"/>
    <path d="M105 277C221 188 357 162 520 183" stroke="#bd634b"/>
    <path d="M187 302V310M277 302V310M367 302V310M457 302V310M101 126H109M101 186H109M101 246H109" opacity=".5"/>
    <circle cx="105" cy="277" r="5" fill="#242621"/>
  </g>
  <g fill="#242621">
    <circle cx="156" cy="222" r="2.5"/><circle cx="217" cy="175" r="2.5"/><circle cx="277" cy="145" r="2.5"/><circle cx="338" cy="126" r="2.5"/><circle cx="399" cy="114" r="2.5"/><circle cx="460" cy="108" r="2.5"/><circle cx="520" cy="105" r="3.5"/>
  </g>
  <g fill="#bd634b">
    <circle cx="162" cy="238" r="2.5"/><circle cx="221" cy="209" r="2.5"/><circle cx="281" cy="190" r="2.5"/><circle cx="341" cy="179" r="2.5"/><circle cx="400" cy="176" r="2.5"/><circle cx="460" cy="177" r="2.5"/><circle cx="520" cy="183" r="3.5"/>
  </g>
  <g fill="#7c7b72">
    <circle cx="163" cy="259" r="2.5"/><circle cx="222" cy="245" r="2.5"/><circle cx="281" cy="238" r="2.5"/><circle cx="341" cy="237" r="2.5"/><circle cx="400" cy="240" r="2.5"/><circle cx="460" cy="247" r="2.5"/><circle cx="520" cy="257" r="3.5"/>
  </g>
  <g font-family="ui-monospace, 'Courier New', monospace" fill="#7c7b72" font-size="9" letter-spacing="1.5">
    <text x="547" y="330" text-anchor="end">PITCH PROGRESSION →</text>
    <text x="84" y="88" text-anchor="end" transform="rotate(-90 84 88)">MOVEMENT →</text>
    <text x="535" y="108" fill="#242621">01</text><text x="535" y="186" fill="#bd634b">02</text><text x="535" y="260">03</text>
    <text x="320" y="361" text-anchor="middle" letter-spacing="2">OBSERVE → COMPARE → PREDICT</text>
  </g>
</svg>
