<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Named entity recognition</title>
  <desc id="desc">A sentence flows through a language model, which identifies Austin as a location.</desc>
