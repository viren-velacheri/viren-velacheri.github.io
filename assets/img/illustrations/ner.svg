    <rect x="87" y="97" width="96" height="42" rx="2"/>
    <rect x="207" y="97" width="96" height="42" rx="2"/>
    <rect x="327" y="97" width="96" height="42" rx="2"/>
    <rect x="447" y="97" width="106" height="42" rx="2"/>
    <path d="M135 139V177M255 139V177M375 139V177M500 139V177" opacity=".45"/>
    <rect x="87" y="177" width="466" height="56" rx="2"/>
    <path d="M135 233V271M255 233V271M375 233V271" opacity=".45"/>
    <path d="M130 266L135 271L140 266M250 266L255 271L260 266M370 266L375 271L380 266" opacity=".45"/>
  </g>
  <g stroke="#bd634b" stroke-width="1">
