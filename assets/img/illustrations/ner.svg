  </g>
  <g font-family="ui-monospace, 'Courier New', monospace" text-anchor="middle" fill="#242621">
    <text x="135" y="123" font-size="15">A</text>
    <text x="255" y="123" font-size="15">trip</text>
    <text x="375" y="123" font-size="15">to</text>
    <text x="500" y="123" font-size="15">Austin</text>
    <text x="320" y="210" font-size="12" letter-spacing="3">CONTEXTUAL REPRESENTATION</text>
    <text x="135" y="303" font-size="13" fill="#7c7b72">O</text>
    <text x="255" y="303" font-size="13" fill="#7c7b72">O</text>
    <text x="375" y="303" font-size="13" fill="#7c7b72">O</text>
    <text x="500" y="303" font-size="11" fill="#bd634b" letter-spacing="1">LOCATION</text>
    <text x="320" y="361" font-size="9" fill="#7c7b72" letter-spacing="2">LANGUAGE → CONTEXT → ENTITIES</text>
  </g>
